apply from: './../config.gradle'
apply plugin: 'com.android.application'
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.ansolm.wifimanager.example'
    compileSdk = 37
    defaultConfig {
        applicationId "com.ansolm.wifimanager.example"
        minSdk = 21
        targetSdk = 37
        versionCode buidConfig.versionCode
        versionName buidConfig.versionName
    }
}
dependencies {
    implementation dependent.appcompat
    implementation dependent.constraintlayout
    implementation project(':wifimanager')
}
